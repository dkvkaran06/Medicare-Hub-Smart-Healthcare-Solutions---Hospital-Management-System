spring.application.name=hospital-management-backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medicare_hub}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP connection pool -------------------------------------------------
# The DB is on Railway while the app runs on Render, so every new connection
# pays a cross-cloud TCP + SSL handshake. Keep a couple of connections warm and
# periodically ping idle ones so Railway's proxy doesn't silently drop them,
# rather than opening a fresh connection on each request.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.pool-name=HmsHikariPool

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jackson.serialization.fail-on-empty-beans=false

# --- JWT auth -----------------------------------------------------------------
# Secret MUST be >= 32 bytes (HS256) or the app fails fast at startup. Production
# overrides this via the JWT_SECRET env var on Render; the dev fallback below is
# only so local boot works. Token lifetime is 24h.
app.jwt.secret=${JWT_SECRET:dev-only-change-me-please-override-with-a-32B-minimum-secret}
app.jwt.expiration-ms=86400000